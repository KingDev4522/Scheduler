services:
  - type: web
    name: cit-scheduler
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Free tier (512 MB / 0.1 CPU) is too small for the CP-SAT solve and
    # Render kills the request -> 502. Standard gives enough headroom.
    plan: standard
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_PATH
        value: /data/state.sqlite3
      - key: CORS_ORIGINS
        value: https://cit-scheduler-4-idiots.vercel.app
      - key: CORS_ORIGIN_REGEX
        value: https://[a-z0-9-]+\.vercel\.app
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_MODELS
        value: gemini-2.5-flash,gemini-3.6-flash,gemini-3.5-flash,gemini-3.8-flash
      - key: SESSION_SECRET
        generateValue: true
      - key: DEMO_PASSWORD
        value: "1234"
      - key: ALLOW_DEMO_HEADER
        value: "0"
    disk:
      name: cit-data
      mountPath: /data
      sizeGB: 1
