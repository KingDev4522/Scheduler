services:
  app:
    build: .
    container_name: cit-scheduler
    ports:
      - "8000:8000"
    environment:
      DATABASE_PATH: /data/state.sqlite3
      CORS_ORIGINS: "*"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
    volumes:
      - cit-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 25s

volumes:
  cit-data:
