services:
  app:
    build: .
    container_name: cit-scheduler
    ports:
      - "8000:8000"
    environment:
      DATABASE_PATH: /data/state.sqlite3
      CORS_ORIGINS: http://localhost:8000
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_MODELS: ${GEMINI_MODELS:-gemini-2.5-flash,gemini-3.6-flash,gemini-3.5-flash,gemini-3.8-flash}
      SESSION_SECRET: ${SESSION_SECRET:-}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-1234}
      ALLOW_DEMO_HEADER: "0"
    volumes:
      - cit-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 25s

volumes:
  cit-data:
